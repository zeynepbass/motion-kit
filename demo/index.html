<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>motion-kit demo</title>
    <link rel="stylesheet" href="../dist/index.css">
    <link rel="stylesheet" href="demo.css">
  </head>
  <body>
    <header class="site-header">
      <span class="logo">motion-kit</span>
      <nav class="nav">
        <a class="motion-underline" href="#text">About</a>
        <a class="motion-underline" href="#surfaces">Work</a>
        <a class="motion-underline" href="#buttons">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="text">
        <span class="badge motion-pulse">New</span>
        <h1 class="motion-gradient">Zeynep</h1>
        <p class="role motion-shimmer">Frontend Developer</p>
        <div class="actions" id="buttons">
          <button class="button button-primary motion-button-lift" type="button">Get Started</button>
          <button class="button button-secondary motion-button-shine" type="button">Explore</button>
        </div>
      </section>

      <section class="grid" id="surfaces">
        <article class="card">
          <h2 class="motion-gradient">Zeynep</h2>
          <code>motion-gradient</code>
        </article>
        <article class="card">
          <h2 class="motion-shimmer">Frontend Developer</h2>
          <code>motion-shimmer</code>
        </article>
        <article class="card">
          <h2 class="glow-sample motion-glow">Zeynep</h2>
          <code>motion-glow</code>
        </article>
        <article class="card">
          <div class="border-sample motion-border">Animated border</div>
          <code>motion-border</code>
        </article>
        <article class="card">
          <button class="button button-primary motion-button-lift" type="button">Get Started</button>
          <code>motion-button-lift</code>
        </article>
        <article class="card">
          <button class="button button-primary motion-button-shine" type="button">Explore</button>
          <code>motion-button-shine</code>
        </article>
        <article class="card">
          <span class="badge motion-pulse">New</span>
          <code>motion-pulse</code>
        </article>
        <article class="card">
          <a class="link-sample motion-underline" href="#text">About</a>
          <code>motion-underline</code>
        </article>
      </section>
    </main>
  </body>
</html>
